<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pordic · European Portuguese translator &amp; dictionary</title>
<meta name="description" content="Translate to and from European Portuguese (Portugal), not Brazilian. With a dictionary, examples and conjugations.">
<style>
  :root {
    --bg: #f7f5f0; --card: #ffffff; --text: #1c1f1d; --muted: #5f6763; --line: #e3e0d8;
    --green: #046a38; --green-soft: #e6f2ec; --red: #c8261b; --amber-soft: #fff4e0; --amber: #8a5a00;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111513; --card: #1a1f1c; --text: #e8ece9; --muted: #9aa49e; --line: #2c332f;
            --green: #3fbf7f; --green-soft: #18291f; --red: #ff6b5e; --amber-soft: #2b2414; --amber: #e7b65c; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg);
         color: var(--text); line-height: 1.5; padding: 2rem 1rem 3rem; }
  .wrap { max-width: 820px; margin: 0 auto; }
  header { margin-bottom: 1.5rem; }
  .logo { font-size: 2rem; font-weight: 800; letter-spacing: -.02em; }
  .logo span { color: var(--green); }
  .logo em { color: var(--red); font-style: normal; }
  .tagline { color: var(--muted); }
  .tabs { display: flex; gap: .4rem; border-bottom: 1px solid var(--line); margin-bottom: 1.25rem; }
  .tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: .6rem .9rem; font: inherit;
         font-weight: 600; color: var(--muted); cursor: pointer; }
  .tab[aria-selected="true"] { color: var(--green); border-bottom-color: var(--green); }
  .panel[hidden] { display: none; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.1rem; }
  textarea, input[type=text] { width: 100%; font: inherit; color: var(--text); background: var(--card);
         border: 1px solid var(--line); border-radius: 10px; padding: .75rem .85rem; }
  textarea { min-height: 120px; resize: vertical; }
  textarea:focus, input[type=text]:focus { outline: 2px solid var(--green); outline-offset: 1px; }
  .row { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; margin-top: .75rem; }
  .count { margin-left: auto; color: var(--muted); font-size: .8rem; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .seg button { border: 0; background: var(--card); color: var(--muted); padding: .4rem .8rem; font: inherit;
                font-size: .85rem; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--green); color: #fff; }
  select { font: inherit; font-size: .85rem; padding: .4rem .6rem; border-radius: 999px; border: 1px solid var(--line);
           background: var(--card); color: var(--text); }
  .primary { background: var(--green); color: #fff; border: 0; border-radius: 999px; padding: .6rem 1.3rem;
             font: inherit; font-weight: 700; cursor: pointer; }
  .primary:disabled { opacity: .6; cursor: wait; }
  .chips { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .8rem; }
  .chips span { color: var(--muted); font-size: .8rem; margin-right: .2rem; align-self: center; }
  .chip { border: 1px dashed var(--line); background: none; color: var(--text); border-radius: 999px;
          padding: .25rem .7rem; font: inherit; font-size: .82rem; cursor: pointer; }
  .chip:hover { border-color: var(--green); color: var(--green); }
  .result { margin-top: 1rem; }
  .meta { font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .translation { font-size: 1.25rem; margin: .4rem 0 .2rem; white-space: pre-wrap; }
  .copy { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 999px;
          padding: .2rem .7rem; font: inherit; font-size: .8rem; cursor: pointer; }
  .box { margin-top: .9rem; border-radius: 10px; padding: .75rem .9rem; }
  .box h3 { font-size: .85rem; margin-bottom: .35rem; }
  .box.br { background: var(--amber-soft); color: var(--text); }
  .box.br h3 { color: var(--amber); }
  .box.notes { background: var(--green-soft); }
  .box ul { padding-left: 1.1rem; }
  .pair b { color: var(--green); } .br i { color: var(--amber); }
  .head { font-size: 1.6rem; font-weight: 800; }
  .badges { display: flex; flex-wrap: wrap; gap: .35rem; margin: .3rem 0 .6rem; }
  .badge { font-size: .75rem; background: var(--green-soft); color: var(--green); border-radius: 999px; padding: .1rem .55rem; font-weight: 600; }
  .ex { margin: .3rem 0; } .ex .en { color: var(--muted); font-size: .9rem; }
  table { border-collapse: collapse; margin-top: .3rem; }
  td { padding: .15rem .9rem .15rem 0; } td:first-child { color: var(--muted); }
  .error { margin-top: 1rem; background: #fde8e6; color: #8a1c13; border-radius: 10px; padding: .75rem .9rem; }
  @media (prefers-color-scheme: dark) { .error { background: #3a1714; color: #ffb4ab; } }
  .loading { margin-top: 1rem; color: var(--muted); }
  footer { margin-top: 2rem; color: var(--muted); font-size: .8rem; text-align: center; }
  footer a { color: inherit; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><span>por</span>dic<em>.</em></div>
    <p class="tagline">Translator and dictionary for <strong>European Portuguese</strong>, as spoken in Portugal, not Brazil.</p>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-translate" aria-selected="true" aria-controls="panel-translate">Translate</button>
    <button class="tab" role="tab" id="tab-dictionary" aria-selected="false" aria-controls="panel-dictionary">Dictionary</button>
  </div>

  <!-- Translate -->
  <section class="panel" id="panel-translate" role="tabpanel" aria-labelledby="tab-translate">
    <div class="card">
      <label for="text" class="meta">Text in any language</label>
      <textarea id="text" maxlength="{{ max_text }}" placeholder="Type or paste text… (Ctrl+Enter to translate)"></textarea>
      <div class="row">
        <div class="seg" role="group" aria-label="Direction">
          <button data-dir="auto" aria-pressed="true">Auto</button>
          <button data-dir="to_pt" aria-pressed="false">→ Português (PT)</button>
          <button data-dir="to_en" aria-pressed="false">→ English</button>
        </div>
        <select id="register" aria-label="Register">
          <option value="neutral">Keep the tone</option>
          <option value="informal">Informal (tu)</option>
          <option value="formal">Formal (você / o senhor)</option>
        </select>
        <span class="count"><span id="count">0</span> / {{ max_text }}</span>
        <button class="primary" id="translate">Translate</button>
      </div>
      <div class="chips"><span>Try:</span>
        <button class="chip" data-text="Where is the train station? I need to catch the bus to the airport.">Train station</button>
        <button class="chip" data-text="I'm having breakfast and my phone is ringing.">Breakfast &amp; phone</button>
        <button class="chip" data-text="Estou a apanhar o comboio para o Porto.">Estou a apanhar o comboio…</button>
      </div>
    </div>
    <div id="translate-out" aria-live="polite"></div>
  </section>

  <!-- Dictionary -->
  <section class="panel" id="panel-dictionary" role="tabpanel" aria-labelledby="tab-dictionary" hidden>
    <div class="card">
      <label for="word" class="meta">A word or short phrase, in Portuguese or English</label>
      <div class="row" style="margin-top:.35rem">
        <input type="text" id="word" maxlength="{{ max_word }}" placeholder="e.g. comboio, to catch, pequeno-almoço" style="flex:1;min-width:200px">
        <button class="primary" id="lookup">Look up</button>
      </div>
      <div class="chips"><span>Try:</span>
        <button class="chip" data-word="comboio">comboio</button>
        <button class="chip" data-word="apanhar">apanhar</button>
        <button class="chip" data-word="mobile phone">mobile phone</button>
        <button class="chip" data-word="fixe">fixe</button>
      </div>
    </div>
    <div id="lookup-out" aria-live="polite"></div>
  </section>

  <footer>AI-generated translations can contain mistakes. Check anything important.
    · <a href="https://github.com/saeedm31/pordic">Source on GitHub</a></footer>
</div>

<script>
// Small DOM helper. All model output goes in as text, never as HTML.
function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  Object.entries(attrs || {}).forEach(([k, v]) => k === 'class' ? node.className = v : node.setAttribute(k, v));
  children.flat().forEach(c => node.append(c instanceof Node ? c : document.createTextNode(c ?? '')));
  return node;
}

async function post(url, body) {
  const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error(data.error || 'Something went wrong. Please try again.');
  return data;
}

async function run(button, out, request, render) {
  button.disabled = true;
  out.replaceChildren(el('p', { class: 'loading' }, 'Working on it…'));
  try { out.replaceChildren(render(await request())); }
  catch (e) { out.replaceChildren(el('div', { class: 'error', role: 'alert' }, e.message)); }
  finally { button.disabled = false; }
}

// Tabs
document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(t => {
    const on = t === tab;
    t.setAttribute('aria-selected', on);
    document.getElementById(t.getAttribute('aria-controls')).hidden = !on;
  });
}));

// Translate
let direction = 'auto';
const text = document.getElementById('text'), count = document.getElementById('count');
const tBtn = document.getElementById('translate'), tOut = document.getElementById('translate-out');
text.addEventListener('input', () => count.textContent = text.value.length);
document.querySelectorAll('[data-dir]').forEach(b => b.addEventListener('click', () => {
  direction = b.dataset.dir;
  document.querySelectorAll('[data-dir]').forEach(x => x.setAttribute('aria-pressed', x === b));
}));

function renderTranslation(r) {
  const copy = el('button', { class: 'copy' }, 'Copy');
  copy.addEventListener('click', () => navigator.clipboard.writeText(r.translation)
    .then(() => { copy.textContent = 'Copied'; setTimeout(() => copy.textContent = 'Copy', 1500); }));
  const card = el('div', { class: 'card result' },
    el('div', { class: 'meta' }, `${r.detected_language} → ${r.target_language || 'translation'}`),
    el('p', { class: 'translation', lang: r.target_language === 'English' ? 'en' : 'pt-PT' }, r.translation),
    copy);
  if (r.brazilian_differences.length) {
    card.append(el('div', { class: 'box br' }, el('h3', {}, '🇧🇷 In Brazil you would say'),
      el('ul', {}, r.brazilian_differences.map(d => el('li', { class: 'pair' },
        el('b', {}, d.pt_pt), ' (Portugal) · ', el('i', {}, d.pt_br), ' (Brazil)', d.note ? ` — ${d.note}` : '')))));
  }
  if (r.notes.length) card.append(el('div', { class: 'box notes' }, el('h3', {}, 'Notes'), el('ul', {}, r.notes.map(n => el('li', {}, n)))));
  return card;
}

function translate() {
  run(tBtn, tOut, () => post('/api/translate', { text: text.value, direction, register: document.getElementById('register').value }),
      renderTranslation);
}
tBtn.addEventListener('click', translate);
text.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) translate(); });
document.querySelectorAll('[data-text]').forEach(c => c.addEventListener('click', () => {
  text.value = c.dataset.text; count.textContent = text.value.length; translate();
}));

// Dictionary
const word = document.getElementById('word'), lBtn = document.getElementById('lookup'), lOut = document.getElementById('lookup-out');

function renderEntry(e) {
  const badges = [e.part_of_speech, e.gender, e.plural && `plural: ${e.plural}`].filter(Boolean)
    .map(b => el('span', { class: 'badge' }, b));
  const card = el('div', { class: 'card result' },
    el('div', { class: 'head', lang: 'pt-PT' }, e.headword),
    el('div', { class: 'badges' }, badges),
    e.pronunciation ? el('p', { class: 'meta' }, `Say it: ${e.pronunciation}`) : '',
    el('p', {}, el('strong', {}, 'English: '), e.english));
  if (e.examples.length) card.append(el('div', { class: 'box notes' }, el('h3', {}, 'Examples'),
    e.examples.map(x => el('div', { class: 'ex' }, el('div', { lang: 'pt-PT' }, x.pt), el('div', { class: 'en' }, x.en)))));
  if (e.present_tense) card.append(el('div', { class: 'box notes' }, el('h3', {}, 'Present tense'),
    el('table', {}, Object.entries(e.present_tense).map(([p, f]) => el('tr', {}, el('td', {}, p), el('td', { lang: 'pt-PT' }, f))))));
  if (e.brazilian.word) card.append(el('div', { class: 'box br' }, el('h3', {}, '🇧🇷 In Brazil'),
    el('p', {}, el('i', {}, e.brazilian.word), e.brazilian.note ? ` — ${e.brazilian.note}` : '')));
  return card;
}

function lookup() { run(lBtn, lOut, () => post('/api/lookup', { word: word.value }), renderEntry); }
lBtn.addEventListener('click', lookup);
word.addEventListener('keydown', e => { if (e.key === 'Enter') lookup(); });
document.querySelectorAll('[data-word]').forEach(c => c.addEventListener('click', () => { word.value = c.dataset.word; lookup(); }));
</script>
</body>
</html>
